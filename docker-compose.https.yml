# HTTPS overlay with a self-signed certificate generated at container start.
# This is also the base file's default — the overlay exists so the mode can be
# named explicitly in scripts and documentation.
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#   → https://localhost:3443  (http://localhost:3000 redirects to it)
#
# Browsers will warn about the certificate. For certificates a CA signed, use
# docker-compose.commercial.yml instead.
services:
  loxilb-ui:
    environment:
      SSL_MODE: enabled
