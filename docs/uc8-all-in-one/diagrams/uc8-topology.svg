<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
<title id="title">UC-8 all-in-one CI-style test topology</title><desc id="desc">Remote Linux host, isolated Compose network, UI management and two synthetic model routes, with SSH tunnel from local browser.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#365976"/></marker></defs>
<rect width="1280" height="690" fill="#f5f8fc"/><text x="48" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#183650">UC-8 all-in-one: remote Linux test topology</text>
<rect x="45" y="90" width="190" height="130" rx="13" fill="#fff" stroke="#5a7895" stroke-width="2"/><text x="70" y="125" font-family="Arial" font-size="19" fill="#183650">Local browser</text><text x="70" y="154" font-family="Arial" font-size="15">localhost:3019</text><text x="70" y="181" font-family="Arial" font-size="14">SSH tunnel only</text>
<rect x="270" y="84" width="958" height="550" rx="17" fill="#e8f0f8" stroke="#698ba9" stroke-width="2"/><text x="294" y="116" font-family="Arial" font-size="19" font-weight="bold" fill="#183650">Remote dedicated Linux host · Compose project uc8-manual</text><text x="294" y="143" font-family="Arial" font-size="14" fill="#425d73">Example network uc8-manual_lab: 172.20.0.0/16 · addresses change on each installation</text>
<g font-family="Arial" fill="#17364d" font-size="15"><rect x="320" y="182" width="172" height="75" rx="9" fill="#fff" stroke="#698ba9"/><text x="340" y="212">UI 172.20.0.7</text><text x="340" y="238">:8080 / host :3019</text>
<rect x="535" y="182" width="176" height="75" rx="9" fill="#fff" stroke="#698ba9"/><text x="554" y="212">OAM 172.20.0.6</text><text x="554" y="238">:8080</text>
<rect x="765" y="290" width="196" height="110" rx="9" fill="#d1e9fb" stroke="#346e9d" stroke-width="2"/><text x="785" y="320" font-weight="bold">Gateway 172.20.0.5</text><text x="785" y="346">Management :11111</text><text x="785" y="372">Models :20119 / :20120</text>
<rect x="320" y="327" width="190" height="75" rx="9" fill="#fff" stroke="#698ba9"/><text x="340" y="357">client 172.20.0.2</text><text x="340" y="383">verification scripts</text>
<rect x="531" y="474" width="192" height="78" rx="9" fill="#fff" stroke="#698ba9"/><text x="550" y="504">PostgreSQL</text><text x="550" y="530">172.20.0.4:5432</text>
<rect x="1000" y="200" width="200" height="84" rx="9" fill="#fff" stroke="#698ba9"/><text x="1016" y="230">backend shared-model</text><text x="1016" y="256">172.20.0.3:8080</text>
<rect x="1000" y="410" width="200" height="84" rx="9" fill="#fff" stroke="#698ba9"/><text x="1016" y="440">backend other-model</text><text x="1016" y="466">172.20.0.8:8080</text></g>
<g fill="none" stroke="#365976" stroke-width="2.4" marker-end="url(#arrow)"><path d="M235 155 H290 V215 H320"/><path d="M492 218 H535"/><path d="M711 220 H865 V290"/><path d="M510 365 H765"/><path d="M825 400 V513 H723"/><path d="M624 257 V474"/><path d="M961 320 H980 V242 H1000"/><path d="M961 370 H980 V452 H1000"/></g>
<text x="980" y="305" font-family="Arial" font-size="13" fill="#28475f">20119</text><text x="980" y="406" font-family="Arial" font-size="13" fill="#28475f">20120</text><text x="294" y="602" font-family="Arial" font-size="14" fill="#425d73">Synthetic fixtures return fixed usage and receipt counts; they do not run an AI model or GPU.</text><text x="48" y="664" font-family="Arial" font-size="14" fill="#425d73">UI bound to host loopback; Gateway is privileged and shares the Linux host kernel.</text>
</svg>
