# Shared security-header set for every response the container serves.
#
# Lives in its own snippet because nginx add_header does NOT merge across
# levels: a location block that declares even one add_header of its own drops
# EVERY header inherited from the server block. Each such location must
# therefore re-include this file — see nginx-app.conf.template. When adding a
# location with add_header, include this snippet there too.
#
# HSTS is deliberately NOT here: it belongs only to the TLS server block
# (nginx-https.conf.template); advertising it over plain HTTP either does
# nothing or locks out a deployment that fronts this container with its own
# edge.
#
# CSP notes (keep in sync with scripts/container-smoke.sh EXPECTED_CSP):
#   - script-src 'self' only. The bundle must not need inline scripts — the
#     Dockerfile builder sets INLINE_RUNTIME_CHUNK=false (in sync with
#     .env.production) so CRA can never inline its webpack runtime.
#   - style-src keeps 'unsafe-inline': MUI/Emotion injects style tags at
#     runtime; removing it is an Emotion-nonce project, documented as an
#     accepted residual. fonts.googleapis.com serves the Roboto stylesheet
#     linked from index.html; fonts.gstatic.com serves its font files.
#   - connect-src 'self': the SPA only ever calls same-origin /api/oam/*
#     through this container's proxy. Add any approved extra origin
#     explicitly — never a scheme wildcard.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
