name: DCO

# Verifies every non-merge commit in the pull request carries a Developer
# Certificate of Origin sign-off — a `Signed-off-by:` trailer matching the
# commit author (see CONTRIBUTING.md). Self-contained (no third-party action).
# Advisory at launch; promote to a required status check once contributors are
# consistently signing off.
on:
  pull_request:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Set by GitHub from the authenticated actor, so a human cannot forge
          # them — which is what makes the bot allowance below safe.
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          fail=0
          # --no-merges: GitHub-generated merge commits carry no sign-off.
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            author=$(git show -s --format='%an <%ae>' "$sha")
            name=$(git show -s --format='%an' "$sha")
            body=$(git show -s --format='%B' "$sha")
            if printf '%s' "$body" | grep -qiF "Signed-off-by: ${author}"; then
              continue
            fi
            # A GitHub App signs off under its support address while committing
            # under its noreply one, so the exact match above can never succeed
            # for it. Dependabot, for example, authors as
            #   dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>
            # and signs
            #   Signed-off-by: dependabot[bot] <support@github.com>
            # The certificate IS present; only the address differs, and neither
            # address is one the App chooses. Rejecting that is a false failure,
            # and it is the sole reason every open Dependabot PR is unmergeable.
            #
            # Kept deliberately narrow rather than skipping bots wholesale:
            # - the PR itself must have been opened by a Bot account, which
            #   GitHub stamps from the authenticated actor — a human opening a
            #   PR can never satisfy it, whatever they put in a commit;
            # - the commit's author name must be that same bot; and
            # - the sign-off must name that bot at GitHub's support address.
            # A human commit riding along in a bot's PR still needs an exact
            # match, so the certificate a human owes is unchanged.
            if [ "${PR_AUTHOR_TYPE:-}" = "Bot" ] && [ "$name" = "${PR_AUTHOR_LOGIN:-}" ] \
               && printf '%s' "$body" | grep -qiF "Signed-off-by: ${name} <support@github.com>"; then
              echo "note: ${sha} signed off by ${name} at GitHub's App address"
              continue
            fi
            echo "::error::commit ${sha} (${author}) is missing a matching Signed-off-by line"
            fail=1
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          if [ "$fail" = 1 ]; then
            echo "DCO check failed. Sign your commits with 'git commit -s' (or"
            echo "retro-sign a branch with 'git rebase --signoff ${BASE_SHA}'). See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off (DCO)."
