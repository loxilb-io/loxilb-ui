name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generated API types are in sync with vendored specs
        run: npm run gen:api:check

      - name: Every connector call maps to a declared backend route (H4 guard)
        run: npm run api:check-mapping

      - name: Unit + backend-contract tests
        run: npm test

      - name: Production build
        run: |
          cp .env.example .env.local
          npm run build
        env:
          CI: 'false' # react-scripts treats warnings as errors under CI=true; lint gates arrive with H7
