name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck the e2e tree
        # `npm run typecheck` and `npm run lint` both cover `src` ONLY, and
        # Playwright transpiles specs with esbuild without type-checking them.
        # Until this step existed a spec could pass an argument no helper
        # accepts and still go green: a toolbar locator was built for an icon
        # the product never renders, which made every absence assertion using
        # it vacuous.
        run: npm run typecheck:e2e

      - name: Generated API types are in sync with vendored specs
        run: npm run gen:api:check

      - name: Every connector call maps to a declared backend route (H4 guard)
        run: npm run api:check-mapping

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Lint policy recurrence guards
        run: npm run test:lint-policy

      - name: Locale parity (en/ko/ja)
        run: npm run locale:check

      - name: Accessibility component checks (axe)
        run: npm run a11y:test

      - name: Unit + backend-contract tests
        run: npm test

      - name: Public build configuration regression
        run: npm run test:build-tools

      - name: Production build (release parity)
        # The exact path releases ship: build:prod with the tracked
        # .env.production, and the same REACT_APP_* values the release
        # workflow and the Dockerfile bake in. The previous `cp .env.example
        # .env.local && npm run build` exercised a bundle no release ever
        # shipped.
        run: npm run build:prod
        env:
          # Warnings are errors: the lint baseline is zero, keep it there.
          CI: 'true'
          REACT_APP_API_URL: /api/oam
          REACT_APP_PUBLIC_URL: /netlox

      - name: Immutable public upstream archive build (author qualification)
        # Run the executable path, including the bundler and emitted contract
        # receipt. These outputs still explicitly report reused dependencies.
        run: |
          node scripts/build-product-model.mjs --model general --commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/model-general" --dependencies "$GITHUB_WORKSPACE" --apply

      - name: No broad-while-unresolved capability fallback (stop-ship guard)
        # The capability surface must fail NARROW: an unresolved/denied
        # flavor probe answering as the gateway exposed gateway-only write
        # controls (certification stop-ship). This greps the trap out of
        # ever returning.
        run: |
          ! grep -rn "?? 'inference-gateway'" src --include="*.ts" --include="*.tsx"

      - name: Build-flag agreement (Dockerfile vs .env.production)
        # Retain the release compatibility flags in both sources. Vite
        # emits an external runtime and explicitly disables source maps;
        # the artifact gates below verify the effective output.
        run: |
          grep -q '^ENV INLINE_RUNTIME_CHUNK=false' Dockerfile
          grep -q '^INLINE_RUNTIME_CHUNK=false' .env.production
          grep -q '^ENV GENERATE_SOURCEMAP=false' Dockerfile
          grep -q '^GENERATE_SOURCEMAP=false' .env.production

      - name: Built shell has no inline script (CSP script-src 'self')
        run: |
          count=$(grep -oE '<script[^>]*>' build/index.html | grep -cv 'src=' || true)
          if [ "${count:-0}" != 0 ]; then
            echo "::error::build/index.html contains ${count} inline <script> tag(s) — the CSP (script-src 'self') will blank the app"
            exit 1
          fi
