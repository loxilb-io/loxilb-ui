name: Build Image

# Blocking PR gate: proves the container image actually builds (not just
# `npm run build`). The Trivy scan here is ADVISORY (report-only) — the blocking
# CRITICAL+fixable gate runs in release.yml before an image is published.
# No registry push happens here.
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (amd64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: loxilb-ui:ci

      - name: Scan image with Trivy (advisory)
        # Report HIGH+CRITICAL with a fix available. Advisory: never blocks the
        # PR — surfacing is the point. The hard gate is in release.yml.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loxilb-ui:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        continue-on-error: true
