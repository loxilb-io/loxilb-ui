name: CodeQL

# Static analysis of the JavaScript/TypeScript code. Advisory at launch (not a
# required status check); findings land in the repository's Security tab. This
# is an interpreted React/TypeScript app with no compiled build, so CodeQL runs
# without a build step (build-mode: none).
#
# NOTE: uploading results to the Security tab needs GitHub Advanced Security,
# which is unavailable on a private org repo (free once the repo is public).
# The analyze step is continue-on-error so the expected upload failure does not
# show red while private; once the repo is public + GHAS on, the upload simply
# succeeds and findings flow to the Security tab (no change needed).

on:
  pull_request:
    branches: [main, 'feat/**']
  schedule:
    - cron: '0 4 * * 2'  # weekly, Tuesday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze js/ts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        # Swallow the expected upload failure while private (needs GHAS); the
        # analysis itself still runs. Green once public + GHAS, upload works.
        continue-on-error: true
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: '/language:javascript-typescript'
