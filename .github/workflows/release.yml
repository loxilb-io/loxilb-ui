name: Release

# Tag-triggered release. Versions follow loxilb-io/loxilb — vMAJOR.MINOR.PATCH
# with an optional build component (v0.9.8.7), or a -rc./-alpha./-beta. suffix
# for a prerelease; the tag is validated below and must agree with the version
# in package.json, which is the single source of truth. Produces:
#   - a static SPA bundle tarball (the built CRA `build/` dir) + SHA256SUMS
#     attached to a GitHub Release
#   - a container image pushed to GHCR (ghcr.io/<owner>/loxilb-ui) — the
#     multi-stage Node build served by nginx — which is Cosign-signed
#     (keyless/OIDC), carries a SLSA build-provenance attestation, and an
#     SPDX SBOM attestation.
#   - the pushed image digest, surfaced in the job summary and appended to the
#     GitHub Release body as a "Verify this release" block (docker pull by
#     digest + cosign verify + SBOM download), so release consumers pin an
#     immutable ref instead of trusting a mutable tag.
# A Trivy CRITICAL+fixable scan gates the image BEFORE it is pushed/published.
# `-rc.` / `-alpha.` / `-beta.` tags publish as prereleases and do NOT move
# the `:latest` image tag.
#
# AUTHORIZATION: this job targets the `release` Environment, so publishing
# waits for a required-reviewer approval even after a tag is pushed — a tag
# alone cannot ship a release.
#
# NOTE: pushing to GHCR requires the org to grant this repo `packages: write`.
on:
  push:
    tags: ['v*']
  # Rebuild the image for an EXISTING tag. Run it with the tag as the ref
  # ("gh workflow run release.yml --ref v0.9.8.7"), not from a branch: the
  # version comes from the ref, so there is no free-text input that could name
  # one tag while the job builds another. This path republishes the image only —
  # the GitHub Release is created on tag push alone (see the step's `if`).
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs publish concurrently — they would race on `:latest` and on
# the release page. Queue instead of cancelling: a half-published release is
# worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gated deployment target: publishing requires an approval from a
    # required reviewer configured on the `release` environment.
    environment: release
    permissions:
      contents: write # create the GitHub Release + append the digest block to its body
      packages: write # push the image to GHCR
      id-token: write # keyless Cosign signing + attestation OIDC
      attestations: write # record build-provenance / SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version
        id: ver
        run: |
          # The ref IS the version, for both triggers. checkout above therefore
          # built exactly the tagged tree — a dispatch cannot build one commit
          # while labelling it as another, and cannot mint a tag that never
          # existed (which is how v0.9.9 came to be).
          if [ "${GITHUB_REF}" != "refs/tags/${GITHUB_REF_NAME}" ]; then
            echo "::error::Release must run on a tag ref, got '${GITHUB_REF}'. Re-run with: gh workflow run release.yml --ref <tag>"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME}"
          # loxilb-ui follows loxilb-io/loxilb's scheme: vMAJOR.MINOR.PATCH with
          # an optional fourth build component (e.g. v0.9.8.7), plus an optional
          # -rc/-alpha/-beta prerelease suffix. Reject anything else so a stray
          # tag cannot publish a release.
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-(rc|alpha|beta)[.-]?[0-9]+)?$'; then
            echo "::error::'${VERSION}' is not a valid version: expected vMAJOR.MINOR.PATCH[.BUILD][-rc.N] (e.g. v0.9.8.7)"
            exit 1
          fi
          # package.json is the single source of truth for the release number —
          # it is what the login page displays. A tag that disagrees with it
          # would ship a UI reporting a version nobody can find, so refuse.
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          BASE="${VERSION%%-*}"   # strip any -rc.N suffix before comparing
          if [ "$PKG_VERSION" != "$BASE" ]; then
            echo "::error::tag '${VERSION}' disagrees with package.json (${PKG_VERSION}). Bump \"version\" in package.json and package-lock.json, then re-tag."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Prerelease when the tag carries an -rc./-alpha./-beta. suffix.
          if echo "$VERSION" | grep -Eq -- '-(rc|alpha|beta)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          VERSION="${{ steps.ver.outputs.version }}"
          TAGS="${IMAGE}:${VERSION}"
          # Only a final (non-prerelease) tag moves :latest.
          if [ "${{ steps.ver.outputs.prerelease }}" = "false" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo 'list<<EOF'
            echo "${TAGS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Build static SPA bundle
        # build:prod, not build — `npm run build` reads .env.local, which is
        # gitignored and absent in CI, so it produced a tarball with an empty
        # REACT_APP_PUBLIC_URL: a bundle that 404s on every route.
        # The REACT_APP_* values mirror the Dockerfile's defaults so the tarball
        # and the image are configured identically.
        env:
          REACT_APP_VERSION: ${{ steps.ver.outputs.version }}
          REACT_APP_API_URL: /api/oam
          REACT_APP_PUBLIC_URL: /netlox
        run: |
          npm ci
          npm run build:prod

      - name: Package tarball + checksums
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DIST="loxilb-ui_${VERSION}_static"
          mkdir -p "dist/${DIST}"
          cp -R build/. "dist/${DIST}/"
          cp LICENSE README.md "dist/${DIST}/" 2>/dev/null || true
          tar -C dist -czf "dist/${DIST}.tar.gz" "${DIST}"
          ( cd dist && sha256sum "${DIST}.tar.gz" > SHA256SUMS )

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load for scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          build-args: VERSION=${{ steps.ver.outputs.version }}

      - name: Trivy gate (CRITICAL + fixable) — blocks publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.ver.outputs.version }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          # Auth forces syft's `registry:` source so it pulls the pushed digest
          # straight from GHCR over HTTPS. Without it syft auto-detects and falls
          # through docker daemon -> containerd (socket is non-root-inaccessible
          # on GHA runners), which hard-fails the scan.
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          # "Create GitHub Release" below attaches sbom.spdx.json itself. Letting
          # the action also attach it would need `actions: read` (it re-downloads
          # its own workflow artifact) — a permission this job deliberately does
          # not hold. Without this the step fails whenever the tag's Release
          # already exists, i.e. on any re-run of an already-published tag.
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Publish digest to job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Image digest"
            echo '```'
            echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        # Tag push only. A dispatch republishes the image for an existing tag;
        # it must never create or mutate the release page.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            sbom.spdx.json

      - name: Append verification commands to the Release body
        # Tag push only, mirroring "Create GitHub Release" above: a dispatch
        # republishes the image and must never mutate the release page (a
        # rebuild yields a new digest; the body keeps the one the tag-push run
        # published and signed).
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          # The release was created by the previous step; retry the read to
          # ride out API read-after-write lag rather than fail a run that has
          # already published and signed the image.
          n=0
          until gh release view "${TAG}" --repo "${REPO}" --json body -q .body > /tmp/body.md; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::release for ${TAG} not found after ${n} attempts"
              exit 1
            fi
            sleep 5
          done
          # Idempotent for the environment-approval re-run case: append once.
          if grep -q '^## Verify this release$' /tmp/body.md; then
            echo "Release body already carries the verification block; nothing to do."
            exit 0
          fi
          {
            echo ""
            echo "## Verify this release"
            echo '```bash'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${REPO}/.github/workflows/release.yml@.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh release download ${TAG} --repo ${REPO} --pattern sbom.spdx.json"
            echo '```'
          } > /tmp/verify.md
          cat /tmp/body.md /tmp/verify.md > /tmp/new-body.md
          gh release edit "${TAG}" --repo "${REPO}" --notes-file /tmp/new-body.md
