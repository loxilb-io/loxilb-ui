name: Local UI browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  process-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser-local -- --repeat-each=3
