# Base nginx configuration for the standalone loxilb-ui container.
#
# No `user` directive: the image runs as the unprivileged `nginx` user, so the
# master process cannot switch users anyway and the directive would only emit a
# startup warning. That is also why the listen ports are 8080/8443 rather than
# 80/443 — binding below 1024 needs a capability this container does not carry.
worker_processes auto;
error_log /var/log/nginx/error.log notice;

# /var/run is root-owned; the unprivileged master writes its pid to /tmp.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Do not advertise the exact nginx version in responses or error pages.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Written at startup by docker-entrypoint.sh from the container's
    # /etc/resolv.conf. The OAM upstream is proxied through a variable so that
    # its name is resolved per request instead of at config-parse time, and
    # that requires a resolver to be configured.
    include /etc/nginx/resolver.conf;

    include /etc/nginx/conf.d/*.conf;
}
