apiVersion: v1
kind: ConfigMap
metadata:
  name: loxilb-ui-config
  namespace: loxilb-system
  labels:
    app: loxilb-ui
    component: frontend
data:
  # Runtime configuration for the container's nginx. The image renders its own
  # configuration from these variables at startup, so no nginx config is
  # embedded here — it used to be, in two copies that drifted from the ones
  # baked into the image.
  #
  # Note that REACT_APP_* are NOT here: Create React App inlines them at build
  # time, so they are properties of the image, not of the deployment. Serving
  # the SPA under a different prefix means rebuilding with a different
  # REACT_APP_PUBLIC_URL, not changing PUBLIC_PATH alone.

  # disabled  — HTTP only; TLS terminated by the ingress (the usual choice)
  # enabled   — HTTPS with a self-signed certificate generated in-pod
  # commercial— HTTPS with certificates mounted at /etc/nginx/ssl
  SSL_MODE: "disabled"

  # OAM API base. nginx proxies /api/oam/* → ${BACKEND_URL}/oam/*.
  # In-cluster example: http://loxilb-oam.loxilb-system.svc.cluster.local:8080
  BACKEND_URL: "http://loxilb-oam.loxilb-system.svc.cluster.local:8080"

  # Host header presented to the backend. Leave empty to derive it from
  # BACKEND_URL, which is correct for an in-cluster Service.
  BACKEND_HOST: ""

  # Verify the backend's TLS chain. Turn on whenever BACKEND_URL is https and
  # the certificate chains to a CA the container trusts.
  BACKEND_TLS_VERIFY: "off"

  # Browser-facing origin, forwarded to OAM as the Origin header so it matches
  # against OAM_ALLOWED_ORIGINS. Set this to your ingress hostname.
  FRONTEND_URL: "https://loxilb-ui.example.com"

  # Path prefix the SPA is served under; must match the REACT_APP_PUBLIC_URL
  # the image was built with (/netlox for published releases).
  PUBLIC_PATH: "/netlox"
