apiVersion: v1
kind: Secret
metadata:
  name: loxilb-ui-secrets
  namespace: loxilb-system
  labels:
    app: loxilb-ui
    component: frontend
type: Opaque
data:
  # OAuth Configuration (base64 encoded)
  # To encode: echo -n "your-value" | base64
  # Example: OAUTH_GOOGLE_CLIENT_ID: "<base64-encoded-google-client-id>"
  # Example: OAUTH_GITHUB_CLIENT_ID: "<base64-encoded-github-client-id>"
  
  # SSL Certificate (if using custom certificates)
  # Example: SSL_CERT: "<base64-encoded-certificate>"
  # Example: SSL_KEY: "<base64-encoded-private-key>"
  
  # API Authentication (if needed)
  # Example: API_TOKEN: "<base64-encoded-api-token>"
