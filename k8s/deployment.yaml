apiVersion: apps/v1
kind: Deployment
metadata:
  name: loxilb-ui
  namespace: loxilb-system
  labels:
    app: loxilb-ui
    component: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: loxilb-ui
      component: frontend
  template:
    metadata:
      labels:
        app: loxilb-ui
        component: frontend
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
      - name: loxilb-ui
        # Pin an immutable release tag in production; :latest is a lab
        # convenience (kustomization.yaml sets the tag).
        image: ghcr.io/loxilb-io/loxilb-ui:latest
        imagePullPolicy: IfNotPresent

        # The image's entrypoint renders its nginx configuration from these
        # variables — there is no init container and no mounted config. Adding
        # a key to the ConfigMap is enough to surface it here.
        envFrom:
        - configMapRef:
            name: loxilb-ui-config

        ports:
        # Unprivileged ports: the container runs as uid 101 with no
        # NET_BIND_SERVICE capability, so it cannot bind 80/443. The Service
        # maps its own 80/443 onto these by name.
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP

        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # Static asset serving: cheap, but sized for the TLS handshakes and
        # proxy buffers of a few hundred concurrent console sessions.
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101   # the image's nginx user
          capabilities:
            drop:
            - ALL
          # The entrypoint writes the rendered config, the resolver snippet and
          # (in enabled mode) a generated certificate, so the root filesystem
          # stays writable. The emptyDir mounts below cover nginx's own scratch
          # paths; making the whole filesystem read-only additionally requires
          # mounting /etc/nginx, which would shadow the templates in the image.
          readOnlyRootFilesystem: false

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx

      volumes:
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      nodeSelector:
        kubernetes.io/os: linux

      terminationGracePeriodSeconds: 30
