apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: loxilb-system

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml

# `labels` rather than the deprecated `commonLabels`. includeSelectors is false
# on purpose: baking these into the Deployment's selector would make the label
# set immutable, so a later edit could not be applied to a running deployment.
# No app.kubernetes.io/version here either — the image tag below is the single
# place the deployed release is chosen, and a hardcoded label just goes stale.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: loxilb-ui
      app.kubernetes.io/component: frontend
      app.kubernetes.io/part-of: loxilb

# The release this tree ships. It must be a published tag (see
# docs/container-image.md); `latest` is a lab convenience, not production.
images:
  - name: ghcr.io/loxilb-io/loxilb-ui
    newTag: v0.9.9.1

# Environment-specific overrides live in overlays/ and use this directory as
# their base:
#
#   # overlays/production/kustomization.yaml
#   resources: [../../]
#   images:
#     - name: ghcr.io/loxilb-io/loxilb-ui
#       newTag: v0.9.9.1
#   patches:
#     - path: production-patches.yaml
