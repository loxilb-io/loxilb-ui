apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loxilb-ui-ingress
  namespace: loxilb-system
  labels:
    app: loxilb-ui
    component: frontend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    # Let's Encrypt (if using cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    #
    # Deliberately absent:
    #   rewrite-target — the pod serves the SPA at /netlox and the API proxy at
    #     /api/oam, exactly the paths the browser requests. The previous
    #     `rewrite-target: /$2` stripped those prefixes before the pod saw them,
    #     which made the SPA redirect to /netlox/ and get rewritten again.
    #   cors-* — every request here is same-origin (the pod proxies the API
    #     under the SPA's own hostname), so CORS does not apply.
spec:
  ingressClassName: nginx  # or your ingress class

  tls:
  - hosts:
    - loxilb-ui.example.com  # Replace with your domain
    secretName: loxilb-ui-tls

  rules:
  - host: loxilb-ui.example.com  # Replace with your domain
    http:
      paths:
      # The SPA.
      - path: /netlox
        pathType: Prefix
        backend:
          service:
            name: loxilb-ui-service
            port:
              number: 80

      # The OAM API, reverse-proxied by the UI pod's own nginx to BACKEND_URL
      # (see the ConfigMap). Keeping it on the same host is what makes every
      # browser request same-origin.
      - path: /api/oam
        pathType: Prefix
        backend:
          service:
            name: loxilb-ui-service
            port:
              number: 80

      # Bare host → the pod redirects to /netlox/.
      - path: /
        pathType: Exact
        backend:
          service:
            name: loxilb-ui-service
            port:
              number: 80
