# Docker Compose for HTTPS with commercial certificates
services:
  loxilb-ui:
    build: .
    ports:
      - "3000:80"    # HTTP (redirects to HTTPS)
      - "3443:443"   # HTTPS
    restart: unless-stopped
    environment:
      - SSL_MODE=commercial
    volumes:
      - ./logs:/var/log/nginx
      # Mount your commercial SSL certificates here
      # Place cert.pem and key.pem in ./ssl/ directory
      - ./ssl:/etc/nginx/ssl
    networks:
      - loxilb-network

networks:
  loxilb-network:
    driver: bridge
